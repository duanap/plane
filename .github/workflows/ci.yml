name: CI

on:
  push:
    branches:
      - dev/v1-core
      - dev/v1.1-ux
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/plane-test.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/plane-build.log

      - name: Smoke built server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/server.mjs >/tmp/plane-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/health >/tmp/plane-health.json; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/plane-server.log
            exit 1
          fi
          grep -q '"ok":true' /tmp/plane-health.json
          for path in / /local.html /online.html /ai.html /web/main.js /web/placement-model.js /local/flow.js /game/game.js /game/geometry.js /web/online.js /online/client-model.js /web/ai.js /ai/session.js /ai/ai.js; do
            curl -fsS "http://127.0.0.1:4173${path}" >/dev/null
          done

      - name: Build Docker image
        run: docker build -t plane-ci:${{ github.sha }} .

      - name: Smoke Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name plane-ci-run -p 127.0.0.1:4174:4173 plane-ci:${{ github.sha }}
          trap 'docker rm -f plane-ci-run >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/health >/tmp/plane-container-health.json; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            docker logs plane-ci-run
            exit 1
          fi
          grep -q '"ok":true' /tmp/plane-container-health.json
          for path in / /local.html /online.html /ai.html /web/main.js /web/placement-model.js /local/flow.js /game/game.js /game/geometry.js /web/online.js /online/client-model.js /web/ai.js /ai/session.js /ai/ai.js; do
            curl -fsS "http://127.0.0.1:4174${path}" >/dev/null
          done
          for attempt in {1..20}; do
            health_status="$(docker inspect --format='{{.State.Health.Status}}' plane-ci-run)"
            if [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$health_status" = "unhealthy" ]; then
              docker logs plane-ci-run
              exit 1
            fi
            sleep 0.5
          done
          docker inspect plane-ci-run
          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plane-ci-diagnostics
          path: |
            /tmp/plane-test.log
            /tmp/plane-build.log
            /tmp/plane-server.log
          if-no-files-found: ignore
